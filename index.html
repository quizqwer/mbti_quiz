:root{
  --bg:        #f5f3ee;
  --surface:   #ffffff;
  --surface-2: #eae6dd;
  --ink:       #211f1c;
  --ink-soft:  #6b665d;
  --line:      rgba(33,31,28,0.12);
  --accent:    #3c6e63;
  --accent-2:  #a98f4b;
  --accent-soft: rgba(60,110,99,0.12);

  --display: "GenSenRounded TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  --body: "GenSenRounded TC", "PingFang TC", "Microsoft JhengHei", sans-serif;

  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:        #17181a;
    --surface:   #212224;
    --surface-2: #2a2b2d;
    --ink:       #ece9e2;
    --ink-soft:  #a7a39a;
    --line:      rgba(236,233,226,0.12);
    --accent:    #6fb3a3;
    --accent-2:  #d1b872;
    --accent-soft: rgba(111,179,163,0.16);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:        #17181a;
  --surface:   #212224;
  --surface-2: #2a2b2d;
  --ink:       #ece9e2;
  --ink-soft:  #a7a39a;
  --line:      rgba(236,233,226,0.12);
  --accent:    #6fb3a3;
  --accent-2:  #d1b872;
  --accent-soft: rgba(111,179,163,0.16);
}

*{box-sizing:border-box;}
[hidden]{display:none !important;}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--body);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
.corner-hex{
  position:fixed; top:-60px; right:-60px;
  width:260px; height:260px;
  opacity:0.5; z-index:0; pointer-events:none;
  color:var(--line);
}
@media (prefers-reduced-motion:no-preference){
  .stage{ animation: rise .4s ease both; }
  @keyframes rise{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }
}

.wrap{
  position:relative; z-index:1;
  max-width:560px; margin:0 auto;
  padding-top: 28px;
  padding-bottom: 40px;
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
  min-height:100svh;
  display:flex; flex-direction:column;
  gap:20px;
}

.hub-link{
  display:inline-flex; align-items:center; gap:4px;
  font-size:13.5px; font-weight:700;
  color:var(--ink-soft); text-decoration:none;
  align-self:flex-start;
}
.hub-link:hover{ color:var(--accent); }

.eyebrow{
  font-family:var(--body); font-weight:700; font-size:14.5px;
  letter-spacing:0.14em; text-transform:uppercase;
  color:var(--accent);
  margin:0 0 10px;
}

#start{
  margin:auto 0; text-align:center;
  position:relative; overflow:hidden;
  padding:40px 28px 32px;
  border-radius:28px;
  color:var(--ink);
  background:rgba(255,255,255,0.6);
  border:1px solid var(--line);
  box-shadow:0 30px 70px -36px rgba(33,31,28,0.18);
}
#start > *{ position:relative; z-index:1; }
#start .eyebrow{ color:var(--accent); }
#start h1{
  font-family:var(--display); font-weight:900;
  font-size:clamp(28px, 7vw, 38px);
  line-height:1.3; margin:12px 0 14px;
  text-wrap:balance; color:var(--ink);
}
#start p.lede{
  font-size:16px; line-height:1.7; color:var(--ink-soft);
  margin:0 auto 26px; max-width:42ch;
}
.mbti-grid{
  display:grid; grid-template-columns:repeat(4, 1fr);
  gap:10px; margin-bottom:10px;
}
.mbti-btn{
  font-family:var(--body); font-weight:800; font-size:16.5px;
  letter-spacing:0.02em;
  color:var(--ink); background:var(--surface-2);
  border:1px solid var(--line); border-radius:14px;
  padding:14px 4px; cursor:pointer;
}
.mbti-btn:active{ transform:scale(0.96); background:var(--accent-soft); color:var(--accent); }
#start .meta{
  margin-top:14px; font-size:14px; color:var(--ink-soft);
}
.alt-link{
  display:inline-block; margin-top:18px;
  font-family:var(--body); font-weight:700; font-size:14.5px;
  color:var(--ink-soft); text-decoration:none;
  background:none; border:none; cursor:pointer;
  padding:0;
}
.alt-link:hover{ color:var(--accent); }

.btn-primary{
  font-family:var(--body); font-weight:700; font-size:18.5px;
  border:none; border-radius:16px;
  padding:16px 36px; cursor:pointer;
  margin-top:4px;
}
#start .btn-primary{ color:#fff; background:var(--ink); }
:root[data-theme="dark"] #start .btn-primary{ color:var(--bg); }
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) #start .btn-primary{ color:var(--bg); }
}
.btn-primary:active{ transform:scale(0.98); }

#picker{
  margin:auto 0; text-align:center;
  position:relative; overflow:hidden;
  padding:40px 28px 32px;
  border-radius:28px;
  color:var(--ink);
  background:rgba(255,255,255,0.6);
  border:1px solid var(--line);
  box-shadow:0 30px 70px -36px rgba(33,31,28,0.18);
}
#picker > *{ position:relative; z-index:1; }
#picker .eyebrow{ color:var(--accent); }
#picker h1{
  font-family:var(--display); font-weight:900;
  font-size:clamp(24px, 6vw, 30px);
  line-height:1.3; margin:12px 0 22px;
  text-wrap:balance; color:var(--ink);
}

#quiz{
  flex:1; display:flex; flex-direction:column;
  position:relative; overflow:hidden;
  padding:22px 24px 26px;
  border-radius:28px;
  color:var(--ink);
  background:rgba(255,255,255,0.6);
  border:1px solid var(--line);
  box-shadow:0 26px 60px -32px rgba(33,31,28,0.16);
}
.rail{
  display:flex; align-items:center; gap:14px;
  margin-bottom:22px;
}
.back-btn{
  flex:none; width:38px; height:38px; border-radius:11px;
  border:1px solid var(--line); background:var(--surface-2);
  color:var(--ink); cursor:pointer;
  display:flex; align-items:center; justify-content:center;
}
.back-btn svg{ width:18px; height:18px; }
.back-btn:active{ transform:scale(0.95); }
.rail-track{
  flex:1; height:6px; border-radius:4px;
  background:var(--line); overflow:hidden;
}
.rail-fill{
  height:100%; border-radius:4px;
  background:var(--accent);
  transition:width .35s ease;
}
.rail-count{
  font-variant-numeric:tabular-nums;
  font-size:14.5px; font-weight:700; color:var(--ink-soft);
  white-space:nowrap;
}
.q-title{
  font-family:var(--display); font-weight:700;
  font-size:clamp(21px,5.2vw,26px); line-height:1.45;
  margin:0 0 18px; color:var(--ink);
  text-wrap:balance;
}
.options{ display:flex; flex-direction:column; gap:10px; }
.option{
  text-align:left;
  font-family:var(--body); font-size:16px; line-height:1.5; color:var(--ink);
  background:var(--surface-2);
  border:1px solid var(--line); border-radius:14px;
  padding:16px 18px; cursor:pointer;
  box-shadow:0 10px 24px -20px rgba(33,31,28,0.3);
  transition:border-color .15s ease, background .15s ease, transform .1s ease;
}
.option:active{ transform:scale(0.99); }

.hero-icon-circle{
  width:76px; height:76px; border-radius:50%;
  background:var(--accent-soft); color:var(--accent);
  display:flex; align-items:center; justify-content:center;
  margin:0 auto 16px;
  font-family:var(--display); font-weight:900; font-size:19px;
  letter-spacing:0.02em;
}
#result{ text-align:center; }
.hero-icon-circle.cycling{
  animation: pulse-circle .5s ease-in-out infinite;
  background:var(--accent-soft); color:var(--accent);
}
@keyframes pulse-circle{
  0%, 100%{ transform:scale(1); }
  50%{ transform:scale(1.06); }
}
.reveal-body{
  opacity:0; transform:translateY(10px);
  transition: opacity .45s ease, transform .45s ease;
}
.reveal-body.show{ opacity:1; transform:translateY(0); }
@media (prefers-reduced-motion:reduce){
  .hero-icon-circle.cycling{ animation:none; }
  .reveal-body{ transition:none; }
}
#result .type-code{
  font-family:var(--body); font-weight:700; font-size:13.5px;
  letter-spacing:0.12em; text-transform:uppercase; color:var(--ink-soft);
  margin:0 0 6px;
}
#result h1{
  font-family:var(--display); font-weight:900;
  font-size:clamp(26px,7vw,34px); line-height:1.25;
  margin:0 0 10px; text-wrap:balance;
}
#result .tagline{
  font-size:16.5px; color:var(--accent); font-weight:700;
  margin:0 0 18px;
}
#result .desc{
  margin:0 auto 14px; max-width:48ch; text-align:left;
  background:rgba(255,255,255,0.6); border:1px solid var(--line);
  border-radius:18px; padding:6px 20px;
}
.stage-row{ padding:16px 0; }
.stage-row + .stage-row{ border-top:1px solid var(--line); }
.stage-label{
  display:inline-flex; align-items:center;
  font-family:var(--body); font-weight:700; font-size:13px;
  letter-spacing:0.06em;
  color:var(--accent); margin:0 0 6px;
}

<script>

/* ---------------- render picker grid (shortcut for people who already know their MBTI) ---------------- */
var grid = document.getElementById("mbti-grid");
ORDER.forEach(function(code){
  var btn = document.createElement("button");
  btn.className = "mbti-btn";
  btn.type = "button";
  btn.textContent = code;
  btn.addEventListener("click", function(){ revealResult(code); });
  grid.appendChild(btn);
});

/* ---------------- quiz questions ----------------
   12 questions, 3 per axis. Majority pole per axis wins (3 is odd, so
   there's always a clear winner) to build the final 4-letter code. */
var QUESTIONS = [
  { q:"剛跟喜歡的人約會完，妳通常會：", opts:[
      {label:"立刻傳訊息跟好朋友分享剛剛發生的每個細節", pole:"E"},
      {label:"自己一個人回味，不急著跟誰說", pole:"I"} ] },
  { q:"連續忙完幾場聚會後，妳最想做的是：", opts:[
      {label:"再約一攤，人多才有活力", pole:"E"},
      {label:"回家一個人安靜充電", pole:"I"} ] },
  { q:"喜歡上一個人，妳比較容易：", opts:[
      {label:"主動找很多話題、很多機會跟對方互動", pole:"E"},
      {label:"在旁邊默默觀察，等對方先靠近", pole:"I"} ] },
  { q:"約會時妳比較容易注意到：", opts:[
      {label:"對方今天穿什麼、點了什麼餐、說話的細節", pole:"S"},
      {label:"整體聊起來的感覺、兩人是不是合拍", pole:"N"} ] },
  { q:"聊未來的時候，妳比較想談：", opts:[

  { q:"收到對方傳來的訊息，妳比較容易：", opts:[
      {label:"照字面意思理解，對方說什麼就是什麼", pole:"S"},
      {label:"去猜字裡行間有沒有別的意思", pole:"N"} ] },
  { q:"吵架的時候，妳比較傾向：", opts:[

      {label:"先陪她把情緒說完，再慢慢聊", pole:"F"} ] },
  { q:"做跟感情有關的決定時，妳比較相信：", opts:[

      {label:"提前講好時間地點，照計畫走", pole:"J"},
      {label:"看當下心情，臨時決定也沒關係", pole:"P"} ] },
  { q:"感情的進展，妳比較希望：", opts:[
      {label:"早點把關係講清楚、定下來", pole:"J"},
      {label:"保持一點彈性，順其自然就好", pole:"P"} ] },
  { q:"生活被打亂行程時，妳的反應是：", opts:[
      {label:"有點煩躁，想趕快調整回原本的安排", pole:"J"},
      {label:"還好，臨時應變對妳來說不難", pole:"P"} ] }
];

var current = 0;
var answers = [];
var shuffledOrders = [];

function computeCode(){
  var tally = { E:0, I:0, S:0, N:0, T:0, F:0, J:0, P:0 };
  answers.forEach(function(pole){ if(pole) tally[pole]++; });
  var code = "";
  code += tally.E >= tally.I ? "E" : "I";
  code += tally.S >= tally.N ? "S" : "N";
  code += tally.T >= tally.F ? "T" : "F";
  code += tally.J >= tally.P ? "J" : "P";
  return code;
}

var railFill = document.getElementById("rail-fill");
var railCount = document.getElementById("rail-count");
var qTitle = document.getElementById("q-title");
var qOptions = document.getElementById("q-options");
var qBackBtn = document.getElementById("q-back-btn");

qBackBtn.addEventListener("click", function(){
  if(current > 0){
    current--;
    renderQuestion();
  }
});

function renderQuestion(){
  var total = QUESTIONS.length;
  railFill.style.width = (current/total*100)+"%";
  railCount.textContent = (current+1)+" / "+total;
  qBackBtn.style.visibility = current===0 ? "hidden" : "visible";

  var item = QUESTIONS[current];
  qTitle.textContent = item.q;
  qOptions.innerHTML = "";

  var order = shuffledOrders[current];
  if(!order){
    order = Math.random() < 0.5 ? [0,1] : [1,0];
    shuffledOrders[current] = order;
  }

  order.forEach(function(idx){
    var opt = item.opts[idx];
    var btn = document.createElement("button");
    btn.className = "option";
    btn.type = "button";
    btn.textContent = opt.label;
    btn.addEventListener("click", function(){
      answers[current] = opt.pole;
      if(current < QUESTIONS.length - 1){
        current++;
        renderQuestion();
      } else {
        revealResult(computeCode());
      }
    });
    qOptions.appendChild(btn);
  });
}

document.getElementById("start-btn").addEventListener("click", function(){
  current = 0;
  answers = [];
  shuffledOrders = [];
  document.getElementById("start").hidden = true;
  document.getElementById("quiz").hidden = false;
  window.scrollTo(0,0);
  renderQuestion();
});

document.getElementById("to-picker").addEventListener("click", function(){
  document.getElementById("start").hidden = true;
  document.getElementById("picker").hidden = false;
  window.scrollTo(0,0);
});

document.getElementById("to-start").addEventListener("click", function(){
  document.getElementById("picker").hidden = true;
  document.getElementById("start").hidden = false;
  window.scrollTo(0,0);
});

function showResult(code){
  var t = TYPES[code];
  if(!t) return;
  document.getElementById("r-code").textContent = code;
  document.getElementById("r-code").classList.remove("cycling");
  document.getElementById("r-code-label").textContent = code;
  document.getElementById("r-name").textContent = t.name;
  document.getElementById("r-tagline").textContent = t.tagline;
  var descEl = document.getElementById("r-desc");
  descEl.innerHTML = "";
  t.stages.forEach(function(s){
    var row = document.createElement("div");
    row.className = "stage-row";
    var label = document.createElement("div");
    label.className = "stage-label";
    label.textContent = s.label;
    var text = document.createElement("div");
    text.className = "stage-text";
    text.textContent = s.text;
    row.appendChild(label);
    row.appendChild(text);
    descEl.appendChild(row);
  });
  document.getElementById("reveal-body").classList.add("show");
  document.getElementById("start").hidden = true;
  document.getElementById("picker").hidden = true;
  document.getElementById("quiz").hidden = true;
  document.getElementById("result").hidden = false;
  window.scrollTo(0,0);
  logEvent("測驗完成", code);
}

/* ---------------- reveal result with a short "decoding" suspense beat ----------------
   Cycles each of the 4 letter slots through that axis's two possible letters,
   settling them one at a time (like a lock clicking into place), then fades
   in the full result card. Falls back to an instant reveal when the visitor
   has asked for reduced motion. */
var AXIS_LETTERS = [["E","I"],["S","N"],["T","F"],["J","P"]];
var prefersReducedMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

function revealResult(code){
  var t = TYPES[code];
  if(!t) return;

  if(prefersReducedMotion){
    showResult(code);
    return;
  }

  document.getElementById("start").hidden = true;
  document.getElementById("picker").hidden = true;
  document.getElementById("quiz").hidden = true;
  document.getElementById("result").hidden = false;
  window.scrollTo(0,0);

  var circle = document.getElementById("r-code");
  var revealBody = document.getElementById("reveal-body");
  revealBody.classList.remove("show");
  circle.classList.add("cycling");

  var finalLetters = code.split("");
  var current = finalLetters.map(function(){ return ""; });
  var settled = [false, false, false, false];

  var cycleTimer = setInterval(function(){
    for(var i=0;i<4;i++){
      if(!settled[i]){
        var pair = AXIS_LETTERS[i];
        current[i] = pair[Math.random() < 0.5 ? 0 : 1];
      }
    }
    circle.textContent = current.join("");
  }, 55);

  [220, 440, 660, 880].forEach(function(delay, i){
    setTimeout(function(){
      settled[i] = true;
      current[i] = finalLetters[i];
      circle.textContent = current.join("");
    }, delay);
  });

  setTimeout(function(){
    clearInterval(cycleTimer);
    showResult(code);
  }, 1050);
}

document.getElementById("back-btn").addEventListener("click", function(){
  document.getElementById("result").hidden = true;
  document.getElementById("quiz").hidden = true;
  document.getElementById("picker").hidden = true;
  document.getElementById("start").hidden = false;
  document.getElementById("reveal-body").classList.remove("show");
  window.scrollTo(0,0);
});

document.getElementById("copy-btn").addEventListener("click", function(){
  var msg = document.getElementById("copy-msg");
  var code = document.getElementById("r-code-label").textContent;
  var url = location.origin + location.pathname + "?type=" + code;
  navigator.clipboard.writeText(url).then(function(){
    msg.textContent = "網址已複製";
    setTimeout(function(){ msg.textContent = ""; }, 2000);
  }).catch(function(){
    msg.textContent = "複製失敗，請手動複製網址";
  });
});

/* ---------------- auto-open from shared link ---------------- */
var params = new URLSearchParams(location.search);
var sharedType = (params.get("type") || "").toUpperCase();
if(sharedType && TYPES[sharedType]){
  showResult(sharedType);
} else {
  logEvent("測驗開啟");
}

})();
</script>
